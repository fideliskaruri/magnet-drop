name: Deploy to GitHub Pages

# main is served at /magnet-drop/ and every variant branch at /magnet-drop/<branch>/.
on:
  push:
    branches: [main, rise, easy, endless, powerups, sound, juice]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VARIANTS: rise easy endless powerups sound juice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main
        run: |
          pnpm install --frozen-lockfile
          BASE_PATH=/magnet-drop/ pnpm build
          mkdir -p site && cp -r dist/. site/
      - name: Build variant branches
        run: |
          for b in $VARIANTS; do
            if git ls-remote --exit-code --heads origin "$b" > /dev/null; then
              echo "::group::$b"
              git worktree add "wt-$b" "origin/$b"
              (cd "wt-$b" && pnpm install --frozen-lockfile && BASE_PATH="/magnet-drop/$b/" pnpm build)
              mkdir -p "site/$b" && cp -r "wt-$b/dist/." "site/$b/"
              echo "::endgroup::"
            else
              echo "branch $b not pushed yet, skipping"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
