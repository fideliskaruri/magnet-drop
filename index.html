<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Magnet Drop · Prototype A</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a2f38' stroke='%233a414c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e5484d'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #mute {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(58, 65, 76, 0.9);
        border-radius: 50%;
        background: rgba(22, 26, 32, 0.8);
        color: #8a93a0;
        cursor: pointer;
        touch-action: none;
        z-index: 11;
      }
      #mute[aria-pressed='true'] {
        color: #e5484d;
      }
      #tune-toggle {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 62px);
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(58, 65, 76, 0.9);
        border-radius: 50%;
        background: rgba(22, 26, 32, 0.8);
        color: #8a93a0;
        cursor: pointer;
        touch-action: none;
        z-index: 11;
      }
      #tune-toggle[aria-expanded='true'] {
        color: #e8ecf1;
        border-color: #c98a2b;
      }
      #tune {
        position: fixed;
        z-index: 10;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(360px, 100vw);
        box-sizing: border-box;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        /* Start below the gear and mute buttons, which stay on top. */
        padding: calc(env(safe-area-inset-top, 0px) + 66px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
        background: rgba(14, 16, 20, 0.96);
        border-left: 1px solid #3a414c;
        color: #e8ecf1;
        font: 14px/1.35 system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #tune[hidden] {
        display: none;
      }
      @media (max-width: 600px) {
        #tune {
          top: auto;
          height: 58vh;
          width: 100vw;
          border-left: 0;
          border-top: 1px solid #3a414c;
          border-radius: 16px 16px 0 0;
          padding-top: 14px;
        }
      }
      #tune h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #e8ecf1;
      }
      #tune h3 {
        margin: 20px 0 6px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8a93a0;
      }
      #tune p {
        margin: 4px 0 0;
        color: #8a93a0;
        font-size: 12px;
      }
      .tune-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .tune-row {
        display: block;
        padding: 8px 10px;
        margin: 0 -10px;
        border-radius: 8px;
      }
      .tune-row.changed {
        background: rgba(201, 138, 43, 0.08);
      }
      .tune-top {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
      }
      .tune-value {
        font-variant-numeric: tabular-nums;
        color: #e8ecf1;
      }
      .tune-row.changed .tune-value {
        color: #c98a2b;
      }
      .tune-hint {
        color: #8a93a0;
        font-size: 12px;
      }
      #tune input[type='range'] {
        width: 100%;
        height: 28px;
        margin: 2px 0;
        accent-color: #e8ecf1;
        touch-action: none;
      }
      #tune button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid #3a414c;
        border-radius: 10px;
        background: rgba(201, 138, 43, 0.08);
        color: #e8ecf1;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      .tune-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      #tune .tune-note {
        margin-top: 18px;
      }
      .tune-stats {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        margin: 10px 0 0;
        font-size: 13px;
      }
      .tune-stats dt {
        color: #8a93a0;
      }
      .tune-stats dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #e8ecf1;
      }
      #tune .tune-status {
        min-height: 18px;
        color: #c98a2b;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
